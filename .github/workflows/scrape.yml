name: scrape

on:
  schedule:
    - cron: '0 3,15 * * *'   # 03:00 and 15:00 UTC: every 12 hours
  workflow_dispatch:
  push:
    paths:
      - 'docs/control/**'    # a change to the control page must trigger a heal

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      # Run, and repair in place if the contract breaks. The heal prompt is the
      # validator's own diagnosis, so no human is involved in the fix.
      - name: Run scraper with self-healing
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          COLLECTOR_ID: ${{ vars.COLLECTOR_ID }}
        run: |
          printf 'BRIGHTDATA_API_KEY=%s\n' "$BRIGHTDATA_API_KEY" > .env
          ./scripts/heal_loop.sh || [ $? -eq 2 ]
        # Exit 2 means the contract is still broken after healing. That is a real result
        # worth publishing, so it is tolerated here and the job is failed at the end.
        # Any other non-zero exit means the run itself failed and must not reach publish.
        continue-on-error: false

      - name: Publish to the site
        run: python3 scripts/publish.py

      # Topic classification needs an API key. Without one, signals.py falls back to
      # patterns rather than failing the run, so a fork still produces a working site.
      - name: Classify topics
        if: env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/classify_topics.py
        continue-on-error: true

      - name: Compute cross-firm signals
        run: python3 scripts/signals.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data results/validate/summary-latest.json scripts/collectors.json
          git diff --staged --quiet || git commit -m "data: scheduled refresh $(date -u +%FT%TZ)"
          git push

      - name: Fail the job if the contract is still broken
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open('results/validate/summary-latest.json'))
          ok = s['healthy_sources']; total = s['sources']
          print(f"{ok}/{total} sources healthy")
          sys.exit(0 if s['healthy'] else 1)
          PY
